// ═══ MAPA ═══════════════════════════════════════════════
const mapBounds = L.latLngBounds(
  [20.45, -103.52],  // esquina suroeste
  [20.70, -103.37]   // esquina noreste
);

const map = L.map('map', {
  maxBounds: mapBounds,
  maxBoundsViscosity: 0.8,
  minZoom: 11,
  maxZoom: 18
}).setView([20.58, -103.44], 12);


L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://carto.com/">CARTO</a> · <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 19
}).addTo(map);

// ═══ MUNICIPIOS ═════════════════════════════════════════
const colores = ['#DE12BF','#EDCB12','#CD4523','#123456'];

MUNICIPIOS.forEach((mun, i) => {
  const latlngs = mun.coords.map(c => [c[1], c[0]]);
  
  const poligono = L.polygon(latlngs, {
    color: colores[i % colores.length],
    weight: 2,
    fillColor: colores[i % colores.length],
    fillOpacity: 0.10,
    dashArray: '6 4'
  }).addTo(map);

  // Etiqueta con el nombre del municipio al centro
  const bounds = poligono.getBounds();
  const center = bounds.getCenter();
  
  const label = L.divIcon({
    className: '',
    html: '<div style="font-size:12px;font-weight:700;color:' + colores[i % colores.length] + ';text-shadow:1px 1px 2px #fff,-1px -1px 2px #fff,1px -1px 2px #fff,-1px 1px 2px #fff;white-space:nowrap">' + mun.name + '</div>',
    iconAnchor: [40, 8]
  });
  
  L.marker(center, {icon: label, interactive: false}).addTo(map);
});

// ═══ MARCADORES Y LISTA ═════════════════════════════════
const markers = {};
const list = document.getElementById('modulo-list');

MODULOS.forEach(m => {

  // Marcador en el mapa
  const marker = L.circleMarker([m.lat, m.lng], {
    radius: 12,
    fillColor: '#1F4E5F',
    fillOpacity: 0.9,
    color: '#fff',
    weight: 2
  }).addTo(map);

  // Número dentro del marcador
  const icon = L.divIcon({
    className: '',
    html: '<div style="background:'+ TIPOS[m.tipo].color +';color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)">' + m.id + '</div>',
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });

  const divMarker = L.marker([m.lat, m.lng], {icon: icon}).addTo(map);

  // Popup
  divMarker.bindPopup(
    '<div class="popup-title">' + m.nombre + '</div>'
    + '<div class="popup-detail">' + m.ubicacion + '</div>'
    + '<div class="popup-tag" style="background:' + TIPOS[m.tipo].color + '22;color:' + TIPOS[m.tipo].color + '">' + TIPOS[m.tipo].label + '</div>'  );

  markers[m.id] = divMarker;

  // Entrada en el panel lateral
  const item = document.createElement('div');
  item.className = 'modulo-item';
  item.innerHTML = '<div class="modulo-num">' + m.id + '</div>'
    + '<div class="modulo-info"><strong>' + m.nombre + '</strong>' + m.ubicacion + '</div>';

  item.addEventListener('click', () => {
    map.setView([m.lat, m.lng], 16);
    divMarker.openPopup();
  });

  list.appendChild(item);
});

// ═══ AJUSTAR VISTA ══════════════════════════════════════
const bounds = L.latLngBounds(MODULOS.map(m => [m.lat, m.lng]));
map.fitBounds(bounds, {padding: [30, 30]});

// ═══ MÓVIL ══════════════════════════════════════════════
document.getElementById('panelBtn').addEventListener('click', () => {
  document.getElementById('panel').classList.toggle('open');
});
