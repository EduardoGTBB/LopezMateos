<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f5f5}
.header{background:#1F4E5F;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:18px;font-weight:600}
.header p{font-size:13px;opacity:.8}
.wrap{display:flex;height:calc(100vh - 52px)}
#map{flex:1;z-index:1}
.panel{width:310px;background:#fff;overflow-y:auto;border-left:1px solid #ddd;padding:0;flex-shrink:0;box-shadow:-2px 0 8px rgba(0,0,0,.06)}
.panel-section{padding:14px 18px;border-bottom:1px solid #eee}
.panel-section h3{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#888;margin-bottom:10px}
.layer-toggle{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;user-select:none}
.layer-toggle:hover{opacity:.85}
.layer-toggle input[type="checkbox"]{display:none}
.swatch{width:28px;height:6px;border-radius:3px;flex-shrink:0;transition:opacity .2s}
.swatch.point{width:12px;height:12px;border-radius:50%}
.swatch.polygon{width:20px;height:14px;border-radius:3px;opacity:.55}
.swatch.dash{background:repeating-linear-gradient(90deg,var(--c) 0 6px,transparent 6px 10px)!important;height:4px}
.layer-toggle.off .swatch{opacity:.15}
.layer-toggle.off .lbl{color:#bbb;text-decoration:line-through}
.lbl{font-size:13px;color:#333;line-height:1.3}
.leaflet-popup-content-wrapper{border-radius:8px;font-family:'Segoe UI',Arial,sans-serif}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.popup-title{font-weight:700;color:#1F4E5F;margin-bottom:4px}
.popup-cat{font-size:11px;color:#888}
.panel-toggle{display:none;position:fixed;bottom:20px;right:20px;z-index:1000;background:#1F4E5F;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
@media(max-width:768px){.panel{position:fixed;top:52px;right:-310px;height:calc(100vh - 52px);z-index:999;transition:right .3s ease}.panel.open{right:0}.panel-toggle{display:block}}

.group-children{
    margin-left:20px;
    display:none;
}

.group-children.open{
    display:block;
}

.group-header{
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
}

.group-arrow{
    width:12px;
    display:inline-block;
    font-size:11px;
}

.group-arrow.open{
    transform:rotate(90deg);
}
</style>

function popup(name,cat,desc){
return '<div class="popup-title">'+name+'</div>'+(desc?'<div class="popup-cat">'+desc+'</div>':'')+'<div class="popup-cat" style="margin-top:4px">'+cat+'</div>';
}

// Component layers
const layerMap={};
LAYERS.forEach(cfg=>{
const g=L.layerGroup();
COMP.features.filter(f=>cfg.match(f.properties.name)).forEach(f=>{
const n=f.properties.name,d=f.properties.description,p_=popup(n,cfg.label,d);
if(f.geometry.type==='Point'){
L.circleMarker([f.geometry.coordinates[1],f.geometry.coordinates[0]],{radius:8,fillColor:cfg.color,fillOpacity:.9,color:'#fff',weight:2}).bindPopup(p_).addTo(g);
}else if(f.geometry.type==='Polygon'){
L.polygon(f.geometry.coordinates[0].map(c=>[c[1],c[0]]),{color:cfg.color,weight:2,fillColor:cfg.color,fillOpacity:.35}).bindPopup(p_).addTo(g);
}else{
const opts={color:cfg.color,weight:cfg.weight||4,opacity:.85};
if(cfg.dash)opts.dashArray=cfg.dash;
L.polyline(f.geometry.coordinates.map(c=>[c[1],c[0]]),opts).bindPopup(p_).addTo(g);
}});
g.addTo(map);layerMap[cfg.id]={group:g,cfg};
});

// Panel toggles
function mkToggle(container,id,label,color,type,layerGroup,on){
const div=document.createElement('div');
div.className='layer-toggle'+(on?'':' off');
const sc=type==='point'?'swatch point':type==='polygon'?'swatch polygon':type==='dash'?'swatch dash':'swatch';
div.innerHTML='<input type="checkbox" id="cb-'+id+'" '+(on?'checked':'')+'><span class="'+sc+'" style="background:'+color+';--c:'+color+'"></span><span class="lbl">'+label+'</span>';
div.addEventListener('click',()=>{
const cb=div.querySelector('input');cb.checked=!cb.checked;
if(cb.checked){map.addLayer(layerGroup);div.classList.remove('off')}
else{map.removeLayer(layerGroup);div.classList.add('off')}});
container.appendChild(div);
}

function mkGroup(container,label){

    const wrapper=document.createElement('div');

    const header=document.createElement('div');
    header.className='group-header';

    const arrow=document.createElement('span');
    arrow.className='group-arrow';
    arrow.textContent='▶';

    const title=document.createElement('span');
    title.textContent=label;

    header.appendChild(arrow);
    header.appendChild(title);

    const children=document.createElement('div');
    children.className='group-children';

    header.addEventListener('click',()=>{

        children.classList.toggle('open');
        arrow.classList.toggle('open');

    });

    wrapper.appendChild(header);
    wrapper.appendChild(children);

    container.appendChild(wrapper);

    return children;
}

    // Componentes viales sueltos (elevado, exprés, tp)
    if(compOrder.includes(cfg.id)){
        mkToggle(cc, cfg.id, cfg.label, cfg.color, cfg.type==='line'&&cfg.dash?'dash':cfg.type, layerMap[cfg.id].group, true);
        return;
    }

    // Infraestructura Urbana
    let destino=uc;
    if(espacioIds.includes(cfg.id)) destino=espacioContainer;
    else if(cicloIds.includes(cfg.id)) destino=cicloContainer;
    else if(cruceIds.includes(cfg.id)) destino=crucesContainer;

    mkToggle(destino, cfg.id, cfg.label, cfg.color, cfg.type==='line'&&cfg.dash?'dash':cfg.type, layerMap[cfg.id].group, true);
});
